<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PersonalTrainz">
  <meta name="description" content="Your personal 6-day calisthenics workout tracker.">
  <title>PersonalTrainz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header id="app-header" role="banner">
    <div class="header-left">
      <span class="app-logo" aria-hidden="true">PT</span>
      <span class="app-name">PersonalTrainz</span>
    </div>
    <div id="progress-count" aria-label="Progress"></div>
  </header>

  <!-- ── Day Tabs ── -->
  <nav id="day-tabs" role="tablist" aria-label="Select workout day"></nav>

  <!-- ── Main Workout Content ── -->
  <main id="main-content" role="main" tabindex="-1"></main>

  <!-- ── Timer Modal (Bottom Sheet) ── -->
  <div id="timer-modal" class="timer-modal hidden" role="dialog" aria-modal="true" aria-label="Exercise Timer">
    <div class="timer-backdrop" id="timer-backdrop"></div>
    <div class="timer-sheet">
      <div class="timer-handle" aria-hidden="true"></div>

      <div class="timer-exercise-name" id="timer-exercise-name"></div>

      <div class="timer-sets-row" id="timer-sets-row"></div>

      <div class="timer-countdown">
        <div class="timer-digits" id="timer-digits">0</div>
        <div class="timer-status"  id="timer-status">Ready</div>
      </div>

      <div class="timer-controls">
        <button class="btn-icon" id="timer-reset"    aria-label="Reset timer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>

        <button class="btn-main" id="timer-toggle" aria-label="Start or pause timer">Start</button>

        <button class="btn-icon" id="timer-close" aria-label="Close timer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6"  x2="6"  y2="18"/>
            <line x1="6"  y1="6"  x2="18" y2="18"/>
          </svg>
        </button>

        <button class="btn-next-set" id="timer-next-set" aria-label="Move to next set">
          Next Set →
        </button>

        <button class="btn-main" id="timer-finished" style="display:none;grid-column:1/-1;" aria-label="Mark exercise as done">
          ✓ Mark as Done
        </button>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
